<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robloxerlc Beta</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#11151b;color:white}button,input{font:inherit}
.page{display:none;min-height:100vh}.show{display:block}.center{display:grid;place-items:center}.card{width:min(92%,400px);background:#202630;padding:25px;border-radius:20px}
h1{margin:0 0 8px}.muted{color:#b8c0cc}.stack{display:grid;gap:10px}button{border:0;border-radius:10px;padding:13px;font-weight:bold}.green{background:#39d875}.blue{background:#4285f4;color:white}.dark{background:#343b47;color:white}
input{width:100%;padding:13px;border:0;border-radius:9px;margin:5px 0}header{padding:16px;background:#202630;display:flex;justify-content:space-between}.content{padding:20px;max-width:800px;margin:auto}
.friends{display:flex;gap:10px;overflow:auto}.friend{background:#202630;padding:12px;border-radius:13px;min-width:90px;text-align:center}.game{background:#202630;border-radius:15px;padding:15px;max-width:230px}.cover{height:120px;background:#394455;border-radius:10px;display:grid;place-items:center;font-size:55px}
#world{height:100vh;position:relative;overflow:hidden;background:linear-gradient(#70b8ee 0 58%,#58b354 58%)}#player{position:absolute;left:50%;top:55%;font-size:55px}.house{position:absolute;left:12%;top:36%;font-size:80px}.car{position:absolute;right:10%;top:62%;font-size:65px}
.top{position:absolute;top:10px;left:10px}.controls{position:absolute;bottom:18px;left:18px;display:grid;grid-template-columns:55px 55px 55px;gap:5px}.controls button{background:#fffd;font-size:20px}.chat{position:absolute;right:12px;bottom:15px;width:min(340px,55vw);background:#111e;padding:10px;border-radius:13px}.msgs{height:110px;overflow:auto;background:#0005;padding:7px;border-radius:7px}.send{display:flex;gap:4px;margin-top:5px}.send input{min-width:0}.send button{width:80px}
</style></head><body>
<section id="welcome" class="page show center"><div class="card"><h1>ROBLOXERLC</h1><p class="muted">BETA • nossa plataforma de jogos</p><div class="stack"><button class="green" onclick="auth('create')">CRIAR CONTA</button><button class="dark" onclick="auth('login')">ENTRAR</button></div></div></section>
<section id="login" class="page center"><div class="card"><h1 id="title">Criar conta</h1><input id="user" placeholder="Nome de usuário" maxlength="18"><input id="pass" type="password" placeholder="Senha"><p id="error" class="muted"></p><div class="stack"><button class="green" onclick="submit()">CONTINUAR</button><button class="dark" onclick="go('welcome')">VOLTAR</button></div></div></section>
<section id="home" class="page"><header><b>ROBLOXERLC</b><span id="me"></span></header><div class="content"><h2>👥 Amigos</h2><div id="friends" class="friends"></div><p><input id="newFriend" placeholder="Nome do amigo"><button class="blue" onclick="addFriend()">➕ ADICIONAR AMIGO</button></p><h2>🎮 Jogos</h2><div class="game"><div class="cover">🏙️</div><h3>Robloxerlc City</h3><p class="muted">Explore nossa primeira cidade.</p><button class="green" onclick="go('game')">JOGAR</button></div><h2>🛠️ Robloxerlc Studio</h2><p class="muted">Criador de jogos — versão completa virá depois.</p><button class="dark" onclick="alert('Studio está sendo construído!')">ABRIR STUDIO</button><p><button class="dark" onclick="logout()">SAIR DA CONTA</button></p></div></section>
<section id="game" class="page"><div id="world"><div class="house">🏠</div><div class="car">🚗</div><div id="player">🧍</div><button class="top dark" onclick="go('home')">← SAIR</button><div class="controls"><button onclick="move(-5,0)">◀</button><button onclick="move(0,-5)">▲</button><button onclick="move(5,0)">▶</button><span></span><button onclick="move(0,5)">▼</button></div><div class="chat"><b>💬 Chat</b><div id="msgs" class="msgs"><p><b>ROBLOXERLC:</b> Bem-vindo!</p></div><div class="send"><input id="msg" placeholder="Mensagem"><button class="blue" onclick="send()">Enviar</button></div></div></div></section>
<script>
let mode='create',x=50,y=55;const blocked=['namorar'];
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.getElementById(id).classList.add('show')}
function auth(m){mode=m;title.textContent=m==='create'?'Criar conta':'Entrar';go('login')}
function submit(){let u=user.value.trim(),p=pass.value;if(!u||p.length<3){error.textContent='Preencha o nome e uma senha com 3 ou mais caracteres.';return}if(blocked.some(w=>u.toLowerCase().includes(w))){error.textContent='Esse nome não é permitido.';return}if(mode==='create')localStorage.setItem('account_'+u,p);if(localStorage.getItem('account_'+u)!==p){error.textContent='Conta ou senha incorreta.';return}localStorage.setItem('current',u);home()}
function home(){let u=localStorage.getItem('current');if(!u)return go('welcome');me.textContent='👤 '+u;renderFriends();go('home')}
function logout(){localStorage.removeItem('current');go('welcome')}
function getFriends(){return JSON.parse(localStorage.getItem('friends')||'["Alex","Bia"]')}
function renderFriends(){friends.innerHTML=getFriends().map(n=>'<div class="friend">🟢<br>🙂<br>'+n+'</div>').join('')}
function addFriend(){let n=newFriend.value.trim();if(!n)return;let f=getFriends();if(!f.includes(n))f.push(n);localStorage.setItem('friends',JSON.stringify(f));newFriend.value='';renderFriends()}
function move(dx,dy){x=Math.max(5,Math.min(90,x+dx));y=Math.max(15,Math.min(85,y+dy));player.style.left=x+'%';player.style.top=y+'%'}
function send(){let t=msg.value.trim();if(!t)return;if(blocked.some(w=>t.toLowerCase().includes(w))){alert('Esta mensagem não é permitida.');return}msgs.innerHTML+='<p><b>'+localStorage.getItem('current')+':</b> '+t.replace(/[<>]/g,'')+'</p>';msg.value='';msgs.scrollTop=msgs.scrollHeight}
if(localStorage.getItem('current'))home();
</script></body></html>
